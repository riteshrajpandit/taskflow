
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1714;
    --ink-soft: #4a4540;
    --ink-faint: #8a8480;
    --rice: #f7f4ee;
    --rice-deep: #ede9e0;
    --rice-medium: #e2ddd4;
    --washi: #f0ece4;
    --vermilion: #c0392b;
    --vermilion-soft: #e74c3c;
    --vermilion-pale: #fae9e7;
    --indigo: #2c3e6b;
    --indigo-soft: #4a5fa0;
    --indigo-pale: #eaecf4;
    --gold: #9b7a2e;
    --gold-pale: #f5f0e0;
    --matcha: #4a7c59;
    --matcha-pale: #e8f0eb;
    --border: rgba(60,50,40,0.12);
    --border-strong: rgba(60,50,40,0.22);
  }

  #zen-root {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--rice);
    min-height: 600px;
    padding: 0;
    position: relative;
  }

  .zen-header {
    padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }

  .zen-title-block {}
  .zen-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: 0.04em;
  }
  .zen-subtitle {
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    margin-top: 3px;
    text-transform: uppercase;
  }

  .zen-clock-live {
    font-family: 'Noto Serif JP', serif;
    font-size: 24px;
    font-weight: 300;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
  }

  .zen-add-bar {
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--washi);
  }

  .zen-input {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    background: var(--rice);
    border: 1px solid var(--border-strong);
    border-radius: 2px;
    padding: 7px 12px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .zen-input:focus { border-color: var(--indigo-soft); }
  .zen-input::placeholder { color: var(--ink-faint); font-weight: 300; }
  .zen-input-task { flex: 1; }
  .zen-input-time { width: 110px; }

  .zen-btn {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    letter-spacing: 0.06em;
    border: 1px solid var(--border-strong);
    border-radius: 2px;
    padding: 7px 16px;
    cursor: pointer;
    transition: all 0.18s;
    background: var(--rice);
    color: var(--ink-soft);
  }
  .zen-btn:hover { background: var(--rice-deep); }
  .zen-btn-add {
    background: var(--indigo);
    color: #e8eaf0;
    border-color: var(--indigo);
    font-weight: 500;
  }
  .zen-btn-add:hover { background: var(--indigo-soft); border-color: var(--indigo-soft); }

  .zen-timeline-wrap {
    padding: 0 0 40px 0;
    position: relative;
  }

  .zen-day-label {
    padding: 14px 28px 6px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .zen-timeline {
    position: relative;
    padding: 0 28px;
  }

  .zen-spine {
    position: absolute;
    left: 54px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, transparent, var(--border-strong) 10%, var(--border-strong) 90%, transparent);
  }

  .zen-task-row {
    display: flex;
    align-items: flex-start;
    gap: 0;
    margin: 0;
    position: relative;
  }

  .zen-time-col {
    width: 26px;
    font-size: 10px;
    font-family: 'Noto Serif JP', serif;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    text-align: right;
    padding-top: 13px;
    flex-shrink: 0;
  }

  .zen-dot-col {
    width: 28px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 16px;
    flex-shrink: 0;
    position: relative;
  }

  .zen-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1.5px solid var(--indigo-soft);
    background: var(--rice);
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .zen-dot.running { background: var(--indigo); border-color: var(--indigo); animation: pulse-dot 2s infinite; }
  .zen-dot.done { background: var(--matcha); border-color: var(--matcha); }
  .zen-dot.stopped { background: var(--vermilion); border-color: var(--vermilion); }

  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(44,62,107,0.3); }
    50% { box-shadow: 0 0 0 5px rgba(44,62,107,0); }
  }

  .zen-connector {
    position: absolute;
    left: 50%;
    top: 25px;
    bottom: -10px;
    width: 1px;
    background: var(--border);
    transform: translateX(-50%);
    z-index: 1;
  }

  .zen-card-col { flex: 1; min-width: 0; padding: 6px 0 16px 12px; }

  .zen-card {
    background: var(--rice);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .zen-card:hover { border-color: var(--border-strong); background: #ffffff; }
  .zen-card.running { border-left: 3px solid var(--indigo); }
  .zen-card.done { border-left: 3px solid var(--matcha); opacity: 0.72; }
  .zen-card.stopped { border-left: 3px solid var(--vermilion); opacity: 0.8; }

  .zen-card-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: var(--indigo-soft);
    transition: width 1s linear;
    opacity: 0.6;
  }
  .zen-card.done .zen-card-progress { background: var(--matcha); width: 100% !important; }
  .zen-card.stopped .zen-card-progress { background: var(--vermilion); }

  .zen-card-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }

  .zen-card-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    font-family: 'Noto Serif JP', serif;
    flex: 1;
  }
  .zen-card.done .zen-card-name { text-decoration: line-through; color: var(--ink-faint); }

  .zen-badge {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 1px;
    border: 1px solid;
    flex-shrink: 0;
  }
  .zen-badge.running { color: var(--indigo); border-color: var(--indigo-soft); background: var(--indigo-pale); }
  .zen-badge.done { color: var(--matcha); border-color: var(--matcha); background: var(--matcha-pale); }
  .zen-badge.stopped { color: var(--vermilion); border-color: var(--vermilion-soft); background: var(--vermilion-pale); }
  .zen-badge.pending { color: var(--ink-faint); border-color: var(--border-strong); background: transparent; }

  .zen-card-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    color: var(--ink-faint);
    font-family: 'Noto Sans JP', sans-serif;
  }

  .zen-elapsed {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .zen-popup {
    position: fixed;
    inset: 0;
    background: rgba(20,16,12,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .zen-popup.visible { opacity: 1; pointer-events: all; }

  .zen-popup-box {
    background: var(--rice);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 24px 28px;
    width: 320px;
    font-family: 'Noto Serif JP', serif;
  }

  .zen-popup-title {
    font-size: 15px;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .zen-popup-name {
    font-size: 12px;
    color: var(--ink-faint);
    margin-bottom: 20px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
  }
  .zen-popup-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .zen-popup-actions .zen-btn { flex: 1; text-align: center; font-size: 11px; padding: 8px 10px; }
  .zen-btn-done { background: var(--matcha-pale); color: var(--matcha); border-color: var(--matcha); }
  .zen-btn-done:hover { background: var(--matcha); color: #fff; }
  .zen-btn-stop { background: var(--vermilion-pale); color: var(--vermilion); border-color: var(--vermilion-soft); }
  .zen-btn-stop:hover { background: var(--vermilion); color: #fff; }
  .zen-btn-cancel { min-width: 60px; flex: 0; }

  .zen-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-faint);
    font-size: 12px;
    letter-spacing: 0.12em;
    font-family: 'Noto Serif JP', serif;
  }
  .zen-empty-kanji {
    font-size: 36px;
    font-weight: 300;
    margin-bottom: 10px;
    opacity: 0.3;
  }

  .zen-filter-bar {
    padding: 10px 28px;
    display: flex;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    background: var(--rice);
  }
  .zen-filter-btn {
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 4px 12px;
    border-radius: 1px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .zen-filter-btn.active, .zen-filter-btn:hover {
    border-color: var(--indigo-soft);
    color: var(--indigo);
    background: var(--indigo-pale);
  }
</style>

<div id="zen-root">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">Zen Task Timeline — add tasks with start times, track progress, mark complete or stop.</h2>

  <div class="zen-header">
    <div class="zen-title-block">
      <div class="zen-title">時刻表 — Task Flow</div>
      <div class="zen-subtitle">One task at a time. Every moment with intention.</div>
    </div>
    <div class="zen-clock-live" id="live-clock">--:--:--</div>
  </div>

  <div class="zen-add-bar">
    <input class="zen-input zen-input-task" id="task-name" placeholder="Task name..." maxlength="60" />
    <input class="zen-input zen-input-time" id="task-time" type="time" />
    <button class="zen-btn zen-btn-add" onclick="addTask()">+ Add</button>
  </div>

  <div class="zen-filter-bar">
    <button class="zen-filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
    <button class="zen-filter-btn" data-filter="running" onclick="setFilter('running',this)">Running</button>
    <button class="zen-filter-btn" data-filter="done" onclick="setFilter('done',this)">Done</button>
    <button class="zen-filter-btn" data-filter="stopped" onclick="setFilter('stopped',this)">Stopped</button>
  </div>

  <div class="zen-timeline-wrap">
    <div class="zen-day-label" id="day-label"></div>
    <div class="zen-timeline" id="timeline">
      <div class="zen-spine" id="spine"></div>
      <div id="task-list"></div>
    </div>
  </div>

  <div class="zen-popup" id="popup">
    <div class="zen-popup-box">
      <div class="zen-popup-title" id="popup-title">What would you like to do?</div>
      <div class="zen-popup-name" id="popup-sub"></div>
      <div class="zen-popup-actions">
        <button class="zen-btn zen-btn-done" onclick="actionTask('done')">Mark complete</button>
        <button class="zen-btn zen-btn-stop" id="popup-stop-btn" onclick="actionTask('stopped')">Stop task</button>
        <button class="zen-btn zen-btn-cancel" onclick="closePopup()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
  let tasks = [];
  let activeTaskId = null;
  let currentFilter = 'all';
  let tickInterval = null;

  const pad = n => String(n).padStart(2,'0');
  const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const fmtClock = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

  function formatElapsed(ms) {
    const s = Math.floor(ms/1000);
    const h = Math.floor(s/3600);
    const m = Math.floor((s%3600)/60);
    const sec = s%60;
    if(h>0) return `${h}h ${pad(m)}m`;
    if(m>0) return `${m}m ${pad(sec)}s`;
    return `${sec}s`;
  }

  function setDayLabel() {
    const d = new Date();
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('day-label').textContent = `${days[d.getDay()]} · ${months[d.getMonth()]} ${d.getDate()}`;
  }

  function setDefaultTime() {
    const now = new Date();
    document.getElementById('task-time').value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  }

  function addTask() {
    const name = document.getElementById('task-name').value.trim();
    const timeVal = document.getElementById('task-time').value;
    if(!name) { document.getElementById('task-name').focus(); return; }

    let startTime;
    if(timeVal) {
      const [h,m] = timeVal.split(':').map(Number);
      startTime = new Date();
      startTime.setHours(h,m,0,0);
    } else {
      startTime = new Date();
    }

    const task = {
      id: Date.now(),
      name,
      startTime,
      stopTime: null,
      status: 'running',
      progress: 0
    };

    tasks.push(task);
    tasks.sort((a,b) => a.startTime - b.startTime);

    document.getElementById('task-name').value = '';
    setDefaultTime();
    renderAll();
  }

  function renderAll() {
    const list = document.getElementById('task-list');
    const visible = tasks.filter(t => currentFilter === 'all' || t.status === currentFilter);

    if(visible.length === 0) {
      list.innerHTML = `<div class="zen-empty"><div class="zen-empty-kanji">無</div>No tasks yet. Begin with intention.</div>`;
      return;
    }

    list.innerHTML = '';
    visible.forEach((task, idx) => {
      const isLast = idx === visible.length - 1;
      const el = document.createElement('div');
      el.className = 'zen-task-row';
      el.id = `row-${task.id}`;

      const elapsed = task.status === 'running'
        ? Date.now() - task.startTime.getTime()
        : task.stopTime
          ? task.stopTime.getTime() - task.startTime.getTime()
          : 0;

      const prog = task.status === 'done' ? 100
        : task.status === 'running' ? Math.min(99, Math.floor(elapsed/600000*100))
        : task.progress;

      const statusLabel = task.status === 'running' ? 'Running' : task.status === 'done' ? 'Done' : 'Stopped';
      const startStr = fmtTime(task.startTime);
      const stopStr = task.stopTime ? fmtTime(task.stopTime) : '—';

      el.innerHTML = `
        <div class="zen-time-col">${startStr}</div>
        <div class="zen-dot-col">
          <div class="zen-dot ${task.status}"></div>
          ${!isLast ? '<div class="zen-connector"></div>' : ''}
        </div>
        <div class="zen-card-col">
          <div class="zen-card ${task.status}" onclick="openPopup(${task.id})">
            <div class="zen-card-top">
              <div class="zen-card-name">${task.name}</div>
              <div class="zen-badge ${task.status}">${statusLabel}</div>
            </div>
            <div class="zen-card-meta">
              <span>Start ${startStr}</span>
              ${task.stopTime ? `<span>End ${stopStr}</span>` : ''}
              <span class="zen-elapsed" id="elapsed-${task.id}">${formatElapsed(elapsed)}</span>
            </div>
            <div class="zen-card-progress" id="prog-${task.id}" style="width:${prog}%"></div>
          </div>
        </div>
      `;
      list.appendChild(el);
    });
  }

  function tick() {
    const now = new Date();
    document.getElementById('live-clock').textContent = fmtClock(now);

    tasks.forEach(task => {
      if(task.status !== 'running') return;
      const elapsed = Date.now() - task.startTime.getTime();
      const prog = Math.min(99, Math.floor(elapsed / 600000 * 100));

      const elapsedEl = document.getElementById(`elapsed-${task.id}`);
      const progEl = document.getElementById(`prog-${task.id}`);
      if(elapsedEl) elapsedEl.textContent = formatElapsed(elapsed);
      if(progEl) progEl.style.width = prog + '%';
    });
  }

  function openPopup(id) {
    activeTaskId = id;
    const task = tasks.find(t => t.id === id);
    if(!task) return;

    const popup = document.getElementById('popup');
    document.getElementById('popup-title').textContent =
      task.status === 'done' ? 'Task completed' :
      task.status === 'stopped' ? 'Task was stopped' :
      'What would you like to do?';
    document.getElementById('popup-sub').textContent = `「${task.name}」`;

    const stopBtn = document.getElementById('popup-stop-btn');
    stopBtn.style.display = task.status === 'running' ? '' : 'none';
    popup.classList.add('visible');
  }

  function closePopup() {
    document.getElementById('popup').classList.remove('visible');
    activeTaskId = null;
  }

  function actionTask(action) {
    if(!activeTaskId) return;
    const task = tasks.find(t => t.id === activeTaskId);
    if(!task) return;

    if(action === 'done' || action === 'stopped') {
      task.status = action;
      task.stopTime = new Date();
      const elapsed = task.stopTime.getTime() - task.startTime.getTime();
      task.progress = Math.min(99, Math.floor(elapsed / 600000 * 100));
    }

    closePopup();
    renderAll();
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.zen-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAll();
  }

  document.getElementById('task-name').addEventListener('keydown', e => {
    if(e.key === 'Enter') addTask();
  });

  document.getElementById('popup').addEventListener('click', e => {
    if(e.target === document.getElementById('popup')) closePopup();
  });

  setDayLabel();
  setDefaultTime();
  renderAll();
  tick();
  tickInterval = setInterval(tick, 1000);
</script>
